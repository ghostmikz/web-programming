<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="project.css">
    <script src="ajax.js"></script>
    <script src="register.js"></script>
</head>
<body>
    <div class="content">
        <h3>Customer Registration</h3>
        <form action="#" onsubmit="register(); return false;">
            <table>
                <tr><td><label for="email">Email address:</label></td><td><input type="text" id="email"></td></tr>
                <tr><td><label for="firstname">First name:</label></td><td><input type="text" id="firstname"></td></tr>
                <tr><td><label for="surname">Last name:</label></td><td><input type="text" id="surname"></td></tr>
                <tr><td><label for="password">Password:</label></td><td><input type="password" id="password"></td></tr>
                <tr><td><label for="password2">Re-type password:</label></td><td><input type="password" id="password2"></td></tr>
                <tr><td><label for="phone">Contact phone (optional):</label></td><td><input type="text" id="phone"></td></tr>
            </table>
            <p><input type="submit" value="Register"> <input type="reset" value="Reset"></p>
        </form>
        <p id="msg" class="msg"></p>
        <p><a href="buyonline.html">Back</a></p>
    </div>
</body>
</html>
