<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Item</title>
    <link rel="stylesheet" href="project.css">
    <script src="ajax.js"></script>
    <script src="listing.js"></script>
</head>
<body>
    <div class="content">
        <div class="menu">
            <a href="listing.html">Listing</a>
            <a href="processing.html">Processing</a>
            <a href="logout.html">Logout</a>
        </div>
        <h3>Add new item</h3>
        <form action="#" onsubmit="addItem(); return false;">
            <table border="1">
                <tr><td><label for="name">Item name:</label></td><td><input type="text" id="name"></td></tr>
                <tr><td><label for="price">Item price:</label></td><td><input type="text" id="price"></td></tr>
                <tr><td><label for="quantity">Item quantity:</label></td><td><input type="text" id="quantity"></td></tr>
                <tr><td><label for="description">Item description:</label></td><td><textarea id="description" rows="2" cols="24"></textarea></td></tr>
                <tr class="actions"><td><input type="submit" value="Add item"></td><td><input type="reset" value="Reset"></td></tr>
            </table>
        </form>
        <p id="msg" class="msg"></p>
    </div>
</body>
</html>
